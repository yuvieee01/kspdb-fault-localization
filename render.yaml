services:
  - type: web
    name: kspdb-fault-localization-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kspdb-fault-localization-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-haiku-latest

  - type: web
    name: kspdb-fault-localization
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      # Set this once in the Render dashboard to the API's public HTTPS URL.
      # Render Blueprints intentionally do not interpolate service URLs here.
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: kspdb-fault-localization-db
    plan: free
